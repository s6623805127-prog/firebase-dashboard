<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // ใส่ Firebase Config ของตัวเอง
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  // ฟังก์ชันส่งข้อมูล
  function sendData(temp, humidity) {
    set(ref(database, 'sensor_data/current'), {
      temperature: temp,
      humidity: humidity,
      timestamp: Date.now()
    });
  }

  // ทดสอบส่งข้อมูลทุกๆ 5 วินาที
  setInterval(() => {
    const randomTemp = (20 + Math.random() * 15).toFixed(1);
    const randomHum = (40 + Math.random() * 40).toFixed(1);
    sendData(randomTemp, randomHum);
  }, 5000);
</script>
